name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", check-latest: true }
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...
      - run: go test -fuzz FuzzParsers -fuzztime 20s ./internal/mqtt
      - run: go test -fuzz FuzzUnmarshalBinary -fuzztime 10s ./internal/telemetry
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - uses: golangci/golangci-lint-action@v9
        with: { version: latest }
  smoke:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.26", check-latest: true }
      - run: make build
      - run: ulimit -n 65536 && scripts/smoke.sh
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target gateway -t edgemesh-gateway:ci .
      - run: docker build --target tools -t edgemesh-tools:ci .
