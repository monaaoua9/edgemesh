version: "2"
linters:
  default: standard
  enable: [errcheck, govet, staticcheck, unused, ineffassign, bodyclose, errorlint]
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
      - linters: [errcheck]
        text: "Close|Write|Fprint|Encode|Set(Read|Write)?Deadline|Flush"
