# Full local stack: gateway + mock cloud + simulated fleet + Prometheus + Grafana
#   docker compose -f deploy/docker-compose.yml up --build
# Grafana http://localhost:3000 (admin/admin), Prometheus http://localhost:9091
services:
  cloud:
    build: { context: .., target: tools }
    entrypoint: ["/usr/local/bin/cloudmock", "-addr", ":9090"]
    ports: ["9090:9090"]

  gateway:
    build: { context: .., target: gateway }
    command: ["-cloud", "http://cloud:9090/v1/ingest", "-suspect-after", "10s", "-offline-after", "20s", "-log-json"]
    environment:
      EDGE_AUTH_TOKEN: dev-token-change-me
    ports: ["1883:1883", "9000:9000", "8080:8080"]
    volumes: ["gwdata:/data"]
    ulimits: { nofile: { soft: 200000, hard: 200000 } }
    depends_on: [cloud]
    restart: unless-stopped

  simulator:
    build: { context: .., target: tools }
    command: ["-addr", "gateway:1883", "-devices", "2000", "-ramp", "500", "-token", "dev-token-change-me"]
    depends_on: [gateway]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9091:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  gwdata: {}
