# StatefulSet because the WAL is local state: a rescheduled pod must find its
# own buffer again (PVC) or buffered readings are stranded.
apiVersion: v1
kind: Namespace
metadata: { name: edge }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: gateway-rules, namespace: edge }
data:
  rules.json: |
    {
      "engine_temp": { "min": -40, "max": 130, "max_rate_per_sec": 12, "z": 4, "min_std": 0.5 },
      "vibration":   { "max": 15, "z": 4.5, "min_std": 0.1 }
    }
---
# create the real secret out of band (sealed-secrets / external-secrets); this is a placeholder
apiVersion: v1
kind: Secret
metadata: { name: gateway-secrets, namespace: edge }
type: Opaque
stringData:
  EDGE_AUTH_TOKEN: change-me
  EDGE_CLOUD_TOKEN: change-me
---
apiVersion: v1
kind: Service
metadata: { name: gateway-headless, namespace: edge }
spec:
  clusterIP: None
  selector: { app: gateway }
  ports:
    - { name: mqtt, port: 1883 }
    - { name: grpc, port: 9000 }
    - { name: admin, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-devices
  namespace: edge
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports:
    - { name: mqtt, port: 8883, targetPort: 1883 }
    - { name: grpc, port: 9443, targetPort: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: gateway, namespace: edge }
spec:
  serviceName: gateway-headless
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: gateway } }
      containers:
        - name: gateway
          image: ghcr.io/monaaoua9/edgemesh-gateway:latest
          args:
            - -id=$(POD_NAME)
            - -cloud=https://ingest.example.com/v1/ingest
            - -tls-cert=/tls/tls.crt
            - -tls-key=/tls/tls.key
            - -rules=/rules/rules.json
            - -wal-max-mb=8192
            - -log-json
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          envFrom:
            - secretRef: { name: gateway-secrets }
          ports:
            - { name: mqtt, containerPort: 1883 }
            - { name: grpc, containerPort: 9000 }
            - { name: admin, containerPort: 8080 }
          readinessProbe:
            exec: { command: ["/gateway", "healthcheck", "https://127.0.0.1:8080/readyz"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["/gateway", "healthcheck", "https://127.0.0.1:8080/healthz"] }
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { memory: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: rules, mountPath: /rules, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: rules
          configMap: { name: gateway-rules }
        - name: tls
          secret: { secretName: gateway-tls } # kubernetes.io/tls, e.g. from cert-manager
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: gateway, namespace: edge }
spec:
  maxUnavailable: 1
  selector: { matchLabels: { app: gateway } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway, namespace: edge }
spec:
  podSelector: { matchLabels: { app: gateway } }
  policyTypes: [Ingress]
  ingress:
    - ports: [{ port: 1883 }, { port: 9000 }]          # devices
    - from: [{ namespaceSelector: { matchLabels: { name: monitoring } } }]
      ports: [{ port: 8080 }]                          # prometheus only
